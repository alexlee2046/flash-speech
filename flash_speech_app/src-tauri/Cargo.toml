[package]
name = "flash-speech"
version = "2.0.0"
description = "FlashSpeech - Voice to Text HUD"
authors = ["you"]
license = "MIT"
repository = "https://github.com/alexlee2046/flash-speech"
edition = "2021"
rust-version = "1.60"

[build-dependencies]
tauri-build = { version = "1.5.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.8.1", features = ["system-tray", "api-all", "macos-private-api"] }
sherpa-rs = { version = "0.6", features = ["download-binaries"] }
cpal = "0.15"
reqwest = { version = "0.11", features = ["blocking"] }
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.24"
objc = "0.2"

[features]
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol", "tauri/system-tray"]
