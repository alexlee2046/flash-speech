name: Release

on:
  push:
    tags:
      - 'v*'

env:
  MODEL_URL: https://huggingface.co/csukuangfj/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/resolve/main/model.int8.onnx
  TOKENS_URL: https://huggingface.co/csukuangfj/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/resolve/main/tokens.txt

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS-ARM64
            extra_args: ""
          - platform: macos-14
            target: x86_64-apple-darwin
            label: macOS-x64
            extra_args: ""
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux-x64
            extra_args: "--bundles deb"
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x64
            extra_args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            cmake

      - name: Install frontend dependencies
        run: cd flash_speech_app && npm install --legacy-peer-deps

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "FlashSpeech v__VERSION__"
          releaseBody: "Multi-platform release. First launch downloads the SenseVoice speech model (~100MB)."
          releaseDraft: true
          prerelease: false
          projectPath: flash_speech_app
          args: --target ${{ matrix.target }} ${{ matrix.extra_args }}

      # --- Build "with-model" variant for macOS ---
      - name: Download SenseVoice model
        if: startsWith(matrix.platform, 'macos')
        run: |
          mkdir -p /tmp/models
          curl -L -o /tmp/models/model.int8.onnx "$MODEL_URL"
          curl -L -o /tmp/models/tokens.txt "$TOKENS_URL"

      - name: Create macOS with-model DMG
        if: startsWith(matrix.platform, 'macos')
        run: |
          APP_DIR=$(find flash_speech_app/src-tauri/target -name "FlashSpeech.app" -type d | head -1)
          mkdir -p "$APP_DIR/Contents/Resources/models"
          cp /tmp/models/* "$APP_DIR/Contents/Resources/models/"

          ARCH=$(echo "${{ matrix.target }}" | cut -d- -f1)
          VERSION="${GITHUB_REF_NAME#v}"
          DMG_NAME="FlashSpeech_${VERSION}_${ARCH}_with-model.dmg"

          # Create staging dir with app + Applications symlink
          STAGING="/tmp/dmg-staging"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          cp -R "$APP_DIR" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"

          hdiutil create -volname "FlashSpeech" -srcfolder "$STAGING" -ov -format UDZO "/tmp/$DMG_NAME"

          gh release upload "$GITHUB_REF_NAME" "/tmp/$DMG_NAME" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
